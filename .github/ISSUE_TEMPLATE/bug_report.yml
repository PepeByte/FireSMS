name: Bug report
description: Report a reproducible FireSMS bug
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include real SMS messages, tokens, account numbers, private Firefly III URLs, or backup files.
  - type: input
    id: version
    attributes:
      label: FireSMS version or commit
      placeholder: e.g. 1.0.0 or commit SHA
  - type: input
    id: android-version
    attributes:
      label: Android version/device
      placeholder: e.g. Android 14, Pixel 7
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: sanitized-data
    attributes:
      label: Sanitized examples/logs
      description: Replace all private values with fake values before posting.
