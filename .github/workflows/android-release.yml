name: Android Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish APK
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read release version from commit title
        run: |
          title="$(git log -1 --format=%s)"
          if [[ ! "$title" =~ ^Release\ (v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo 'Expected a commit title exactly like Release v1.0.0.' >&2
            exit 1
          fi
          echo "RELEASE_TAG=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Check app version matches tag
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('app/build.gradle.kts').read_text()
          match = re.search(r'versionName\s*=\s*"([^"]+)"', source)
          if not match or f'v{match[1]}' != os.environ['RELEASE_TAG']:
              raise SystemExit('The tag must match versionName in app/build.gradle.kts.')
          PY

      - name: Check signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the default, which includes the obsolete "tools" package.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace

      - name: Sign and verify release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release-keystore.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "dist/FireSMS-${RELEASE_TAG}.apk" \
            "$RUNNER_TEMP/app-release-aligned.apk"
          "$tools/apksigner" verify --verbose "dist/FireSMS-${RELEASE_TAG}.apk"
          cd dist
          sha256sum "FireSMS-${RELEASE_TAG}.apk" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Never attach an APK to a tag pointing at a different commit.
          if existing_sha="$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq '.sha' 2>/dev/null)"; then
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points at a different commit; use a new version." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/FireSMS-${RELEASE_TAG}.apk" dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/FireSMS-${RELEASE_TAG}.apk" dist/SHA256SUMS \
              --verify-tag --title "Release ${RELEASE_TAG}" --generate-notes
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"
